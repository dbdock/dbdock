# dbdock engine test harness
#
# Brings up one container per supported engine on non-default host ports
# (so they don't clash with anything already running locally).
#
#   docker compose -f test-harness/docker-compose.yml up -d
#   docker compose -f test-harness/docker-compose.yml down -v   # tear down
#
# Credentials are intentionally simple test values — never reuse these.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: testpass123
      POSTGRES_DB: testdb
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: testpass123
      MYSQL_DATABASE: testdb
    ports:
      - "53306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ptestpass123"]
      interval: 5s
      timeout: 5s
      retries: 20

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "DbDock!Pass123"
      MSSQL_PID: Developer
    ports:
      - "51433:1433"

  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "testpass123", "--save", "", "--appendonly", "no"]
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "testpass123", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
